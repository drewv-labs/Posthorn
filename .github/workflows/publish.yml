name: Publish to PyPI

on:
  push:
    branches:
      - main
  # Allows you to trigger it manually from the Actions tab if needed
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # This environment name must match what you configure in PyPI
    environment:
      name: pypi
      url: https://pypi.org/p/posthorn

    permissions:
      id-token: write  # REQUIRED: Grants the runner permission to request the OIDC token
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Build package
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
