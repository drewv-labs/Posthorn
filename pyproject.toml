# ──────────────────────────────────────────────────────────────────────────────
# Build System
# ──────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ──────────────────────────────────────────────────────────────────────────────
# Project Metadata
# ──────────────────────────────────────────────────────────────────────────────
[project]
name = "posthorn"
version = "0.2.11"
description = "Lightweight configurable job posting scanner and alerting. Work smarter, not harder"
readme = "README.md"
authors = [
    {name = "Drew Vandagriff", email = "vandagriff.drew@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

# ── Runtime Dependencies ──────────────────────────────────────────────────────
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=0.10.0",
    "httpx>=0.28.1",
    "pytz>=2026.4",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]

# ── Optional / Extra Dependencies ─────────────────────────────────────────────
[project.optional-dependencies]
test = [
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "responses>=0.26.0",
    "respx>=0.23.0",
    "freezegun>=1.5.0",
]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "build>=1.6.0",
    "twine>=7.0.0",
    "ipython>=9.17.0",
]

# ──────────────────────────────────────────────────────────────────────────────
# Project URLs
# ──────────────────────────────────────────────────────────────────────────────
[project.urls]
homepage = "https://duckjobs.dev/"
github = "https://github.com/drewv-labs/Posthorn"

# ──────────────────────────────────────────────────────────────────────────────
# TUI Configuration
# ──────────────────────────────────────────────────────────────────────────────
[project.scripts]
posthorn = "posthorn.cli.tui:main"

# ──────────────────────────────────────────────────────────────────────────────
# Package Configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]
include = ["posthorn*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"posthorn" = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.toml"]
"*" = ["*.ans"]

# ──────────────────────────────────────────────────────────────────────────────
# Pytest Configuration
# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "duckdb: marks tests that require DuckDB connectivity",
    "postgres: marks tests that require PostgreSQL connectivity",
    "leap_year: marks tests for leap year boundary conditions",
    "dst_transition: marks tests for DST transition edge cases",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "ignore::UserWarning",
]

# ──────────────────────────────────────────────────────────────────────────────
# Ruff — Linter & Formatter
# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line length is handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["posthorn"]

# ──────────────────────────────────────────────────────────────────────────────
# MyPy — Static Type Checking
# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/posthorn"]
omit = [
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0  # bump as tests mature (e.g. 80)

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "pytest-asyncio>=1.4.0",
]

# ──────────────────────────────────────────────────────────────────────────────
# Virtual Environment — use uv's lockfile
# ──────────────────────────────────────────────────────────────────────────────
# This project uses `uv` for dependency management.
# Get started: uv sync --all-extras
